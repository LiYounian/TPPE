<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TPPE · 管理后台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #121418; --card: #1b1e24; --ink: #e9e7e2; --muted: #8b919c; --line: #2c3039;
    --field: #14161b; --chip: #262a32; --on-accent: #121418;
    --time: #60a5fa; --place: #4ade80; --person: #fbbf24; --event: #c084fc; --accent: #fb7185; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: 1px; }
  h1 a { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select { font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--field); color: var(--ink); outline: none; }
  input:focus, select:focus { border-color: var(--ink); }
  button { font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--ink);
           background: var(--ink); color: var(--on-accent); cursor: pointer; font-weight: 600; }
  button.ghost { background: transparent; color: var(--ink); }
  button.danger { background: transparent; color: var(--accent); border-color: var(--accent); }
  button.small { padding: 3px 8px; font-size: 12px; white-space: nowrap; }
  button:disabled { opacity: .4; cursor: default; }
  .hidden { display: none !important; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--chip); border-radius: 10px; padding: 8px 14px; min-width: 96px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { background: transparent; color: var(--muted); border-color: var(--line); }
  .tabs button.on { background: var(--ink); color: var(--on-accent); border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
  .el-time { color: var(--time); } .el-place { color: var(--place); }
  .el-person { color: var(--person); } .el-event { color: var(--event); }
  .muted { color: var(--muted); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px;
           border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 9; color: var(--on-accent); }
  .toast.err { background: var(--accent); } .toast.ok { background: var(--ok); }
  .sent { font-size: 15px; }
  .fills { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fills span { margin-right: 10px; }
  .scroll { overflow-x: auto; }
  .tpl { font-size: 15px; line-height: 2; }
  .blank { display: inline-block; line-height: 1.4; padding: 0 8px; margin: 0 2px; border-radius: 6px;
           border: 1.5px dashed currentColor; font-size: 13px; }
  .raw { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .meme-info { font-size: 12px; color: var(--person); }
  .preview { font-size: 13px; color: var(--ok); margin-top: 2px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <h1>TPPE · 管理后台 <a href="/">← 回到游戏</a></h1>

  <section id="login" class="card">
    <div class="row">
      <input id="token" type="password" placeholder="管理口令" autocomplete="current-password" style="min-width:260px">
      <button id="btnLogin">进入</button>
    </div>
    <p class="muted" style="margin:10px 0 0">口令在服务器上：<code>sudo cat /etc/tppe/admin.env</code>。口令只保存在当前标签页，关掉就失效。</p>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <div id="stats" class="stats"></div>
        <button id="btnLogout" class="ghost small">退出</button>
      </div>
    </section>

    <div class="tabs">
      <button data-tab="words" class="on">词库</button>
      <button data-tab="templates">句子模板</button>
      <button data-tab="sentences">历史句子</button>
    </div>

    <!-- 词库 -->
    <section id="tab-words" class="card">
      <div class="row" style="margin-bottom:12px">
        <select id="addEl"></select>
        <input id="addText" type="text" maxlength="40" placeholder="新增一个词（≤20 字符）" style="flex:1;min-width:180px">
        <button id="btnAdd">新增</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <select id="fEl"><option value="">全部元素</option></select>
        <input id="fQ" type="search" placeholder="搜索词或贡献者" style="flex:1;min-width:160px">
        <select id="fSort">
          <option value="new">最新加入</option>
          <option value="use">使用次数</option>
          <option value="pick">被点选次数</option>
          <option value="recent">最近使用</option>
        </select>
        <label class="muted"><input id="fHidden" type="checkbox"> 只看已删除</label>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>词</th><th>元素</th><th>贡献者</th><th>来源</th><th>使用</th><th>点选</th><th>最近使用</th><th>操作</th></tr></thead>
          <tbody id="wordRows"></tbody>
        </table>
      </div>
      <div class="pager"><span id="wordInfo" class="muted"></span>
        <button id="wPrev" class="ghost small">上一页</button><button id="wNext" class="ghost small">下一页</button></div>
    </section>

    <!-- 句子模板（只读） -->
    <section id="tab-templates" class="card hidden">
      <p class="note">模板随代码发布（仓库里的 <code>tppe/templates.json</code>），这里只能查看和试填；想增删改模板，把需求告诉开发，改好推送后服务器约 2 分钟自动生效。</p>
      <div class="row" style="margin-bottom:10px">
        <select id="tKind"><option value="all">全部</option><option value="plain">普通句</option><option value="meme">热梗句</option></select>
        <input id="tQ" type="search" placeholder="搜索模板文字或热梗" style="flex:1;min-width:160px">
        <span id="tInfo" class="muted"></span>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>#</th><th>挖空效果（玩家看到的样子） / 原句</th><th>热梗出处</th><th>抽中</th><th>最近</th><th></th></tr></thead>
          <tbody id="tplRows"></tbody>
        </table>
      </div>
    </section>

    <!-- 历史句子 -->
    <section id="tab-sentences" class="card hidden">
      <div class="row" style="margin-bottom:10px">
        <input id="sQ" type="search" placeholder="搜索句子或填写的词" style="flex:1">
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>时间</th><th>房间</th><th>轮</th><th>句子</th><th>得票</th></tr></thead>
          <tbody id="sentRows"></tbody>
        </table>
      </div>
      <div class="pager"><span id="sentInfo" class="muted"></span>
        <button id="sPrev" class="ghost small">上一页</button><button id="sNext" class="ghost small">下一页</button></div>
    </section>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
const $ = id => document.getElementById(id);
const ORIGIN = { seed: "预置", player: "玩家", admin: "管理员" };
let ELEMENTS = { time: "时间", place: "地点", person: "人物", event: "事件" };
let token = sessionStorage.getItem("tppe_admin") || "";
const wq = { page: 1, total: 0, size: 50 }, sq = { page: 1, total: 0, size: 30 };

// ---------- 请求 ----------
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Admin-Token": token, ...(opts.headers || {}) } });
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (r.status === 401 || r.status === 429) {
    if (r.status === 401) { token = ""; sessionStorage.removeItem("tppe_admin"); showLogin(); }
    throw new Error((body && body.detail) || "口令不对");
  }
  if (!r.ok) throw new Error((body && body.detail) || `请求失败 HTTP ${r.status}`);
  return body;
}

// ---------- 登录 ----------
function showLogin() { $("login").classList.remove("hidden"); $("app").classList.add("hidden"); }
async function login() {
  token = $("token").value.trim() || token;
  if (!token) return toast("请输入管理口令", true);
  try {
    await api("/api/admin/login", { method: "POST" });
    sessionStorage.setItem("tppe_admin", token);
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    $("token").value = "";
    await loadStats(); await loadWords();
  } catch (e) { toast(e.message, true); }
}
$("btnLogin").onclick = login;
$("token").onkeydown = e => { if (e.key === "Enter") login(); };
$("btnLogout").onclick = () => { token = ""; sessionStorage.removeItem("tppe_admin"); showLogin(); };

// ---------- 概览 ----------
async function loadStats() {
  const s = await api("/api/admin/stats");
  ELEMENTS = s.elements;
  const box = $("stats"); box.replaceChildren();
  const add = (v, label, cls = "") => {
    const d = document.createElement("div"); d.className = "stat";
    const b = document.createElement("b"); b.textContent = v; if (cls) b.className = cls;
    const sp = document.createElement("span"); sp.textContent = label;
    d.append(b, sp); box.appendChild(d);
  };
  for (const [el, name] of Object.entries(ELEMENTS)) add(s.words[el] || 0, `${name}词`, `el-${el}`);
  add(s.hidden, "已删除"); add(s.sentences, "历史句子"); add(`${s.rooms} / ${s.players}`, "在线房间 / 人");
  if (!$("addEl").options.length) {
    for (const [el, name] of Object.entries(ELEMENTS)) {
      $("addEl").add(new Option(name, el)); $("fEl").add(new Option(name, el));
    }
  }
}

// ---------- 词库 ----------
async function loadWords() {
  const p = new URLSearchParams({ element: $("fEl").value, q: $("fQ").value.trim(), sort: $("fSort").value,
                                  hidden: $("fHidden").checked, page: wq.page });
  try {
    const d = await api(`/api/admin/words?${p}`);
    wq.total = d.total; wq.size = d.page_size;
    renderWords(d.items);
  } catch (e) { toast(e.message, true); }
}

function cell(text, cls) { const td = document.createElement("td"); td.textContent = text ?? ""; if (cls) td.className = cls; return td; }
function btn(label, cls, fn) { const b = document.createElement("button"); b.textContent = label; b.className = `small ${cls}`; b.onclick = fn; return b; }

function renderWords(items) {
  const tb = $("wordRows"); tb.replaceChildren();
  if (!items.length) { const tr = tb.insertRow(); const td = cell("没有符合条件的词", "muted"); td.colSpan = 8; tr.appendChild(td); }
  for (const w of items) {
    const tr = document.createElement("tr");
    const elTd = document.createElement("td");
    const tag = document.createElement("span"); tag.className = `tag el-${w.element}`; tag.textContent = ELEMENTS[w.element];
    elTd.appendChild(tag);
    tr.append(cell(w.text), elTd, cell(w.author || "—", "muted"), cell(ORIGIN[w.origin]),
              cell(w.use_count, "num"), cell(w.pick_count, "num"),
              cell(w.hidden ? `已删除 ${w.hidden_at || ""}` : (w.last_used_at || "—"), "muted"));
    const ops = document.createElement("td"); ops.className = "row";
    if (w.hidden) ops.appendChild(btn("恢复", "ghost", () => act(`/api/admin/words/${w.id}/restore`, `已恢复「${w.text}」`)));
    else {
      ops.appendChild(btn("改字", "ghost", () => edit(w)));
      ops.appendChild(btn("删除", "danger", () => confirm(`删除「${w.text}」？删除后不再出现在候选里，可在"只看已删除"中恢复。`)
        && act(`/api/admin/words/${w.id}/hide`, `已删除「${w.text}」`)));
    }
    tr.appendChild(ops);
    tb.appendChild(tr);
  }
  const pages = Math.max(1, Math.ceil(wq.total / wq.size));
  $("wordInfo").textContent = `共 ${wq.total} 个 · 第 ${wq.page}/${pages} 页`;
  $("wPrev").disabled = wq.page <= 1; $("wNext").disabled = wq.page >= pages;
}

async function act(path, okMsg) {
  try { await api(path, { method: "POST" }); toast(okMsg); await Promise.all([loadWords(), loadStats()]); }
  catch (e) { toast(e.message, true); }
}

async function edit(w) {
  const t = prompt(`把「${w.text}」改成（≤20 字符）。原词会被隐藏，新词继承使用次数：`, w.text);
  if (t == null || t.trim() === w.text) return;
  try {
    await api(`/api/admin/words/${w.id}`, { method: "PATCH", body: JSON.stringify({ text: t }) });
    toast(`已改为「${t.trim()}」`); await Promise.all([loadWords(), loadStats()]);
  } catch (e) { toast(e.message, true); }
}

$("btnAdd").onclick = async () => {
  const text = $("addText").value.trim();
  if (!text) return toast("先写一个词", true);
  try {
    await api("/api/admin/words", { method: "POST", body: JSON.stringify({ element: $("addEl").value, text }) });
    toast(`已新增「${text}」`); $("addText").value = "";
    await Promise.all([loadWords(), loadStats()]);
  } catch (e) { toast(e.message, true); }
};
$("addText").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) $("btnAdd").click(); };

let qTimer = null;
const reloadWords = () => { wq.page = 1; loadWords(); };
$("fEl").onchange = reloadWords; $("fSort").onchange = reloadWords; $("fHidden").onchange = reloadWords;
$("fQ").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(reloadWords, 300); };
$("wPrev").onclick = () => { wq.page--; loadWords(); };
$("wNext").onclick = () => { wq.page++; loadWords(); };

// ---------- 句子模板 ----------
async function loadTemplates() {
  const p = new URLSearchParams({ kind: $("tKind").value, q: $("tQ").value.trim() });
  try {
    const d = await api(`/api/admin/templates?${p}`);
    $("tInfo").textContent = `显示 ${d.items.length} 条 · 共 ${d.total} 条（热梗 ${d.meme_count} 条）`;
    const tb = $("tplRows"); tb.replaceChildren();
    if (!d.items.length) { const tr = tb.insertRow(); const td = cell("没有符合条件的模板", "muted"); td.colSpan = 6; tr.appendChild(td); }
    for (const t of d.items) {
      const tr = document.createElement("tr");
      const body = document.createElement("td");
      const tpl = document.createElement("div"); tpl.className = "tpl";
      for (const seg of t.segments) {
        if (seg.text !== undefined) { tpl.appendChild(document.createTextNode(seg.text)); continue; }
        const b = document.createElement("span"); b.className = `blank el-${seg.slot}`; b.textContent = ELEMENTS[seg.slot];
        tpl.appendChild(b);
      }
      const raw = document.createElement("div"); raw.className = "raw"; raw.textContent = t.text;
      const pv = document.createElement("div"); pv.className = "preview";
      body.append(tpl, raw, pv);
      const memeTd = document.createElement("td");
      if (t.meme) {
        const m = document.createElement("div"); m.className = "meme-info"; m.textContent = `🔥 ${t.meme.name}`;
        const src = document.createElement("div"); src.className = "muted"; src.textContent = `${t.meme.source} · ${t.meme.date}`;
        memeTd.append(m, src);
      } else memeTd.textContent = "—";
      const op = document.createElement("td");
      op.appendChild(btn("试填", "ghost", async () => {
        try {
          const r = await api(`/api/admin/templates/${t.id}/preview`, { method: "POST" });
          pv.textContent = `试填：${r.sentence}`;
        } catch (e) { toast(e.message, true); }
      }));
      tr.append(cell(t.id, "muted"), body, memeTd, cell(t.used, "num"), cell(t.last_used || "—", "muted"), op);
      tb.appendChild(tr);
    }
  } catch (e) { toast(e.message, true); }
}
$("tKind").onchange = loadTemplates;
$("tQ").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadTemplates, 300); };

// ---------- 历史句子 ----------
async function loadSentences() {
  const p = new URLSearchParams({ q: $("sQ").value.trim(), page: sq.page });
  try {
    const d = await api(`/api/admin/sentences?${p}`);
    sq.total = d.total; sq.size = d.page_size;
    const tb = $("sentRows"); tb.replaceChildren();
    if (!d.items.length) { const tr = tb.insertRow(); const td = cell("还没有历史句子", "muted"); td.colSpan = 5; tr.appendChild(td); }
    for (const s of d.items) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      const main = document.createElement("div"); main.className = "sent";
      main.textContent = (s.meme ? "🔥 " : "") + s.sentence;
      td.appendChild(main);
      if (s.answers) {
        const f = document.createElement("div"); f.className = "fills";
        for (const [el, a] of Object.entries(s.answers)) {
          const sp = document.createElement("span"); sp.className = `el-${el}`;
          const auto = s.auto_filled && s.auto_filled.includes(el) ? "⏰" : "";
          sp.textContent = `${ELEMENTS[el]}：${a.by}${auto}`;
          f.appendChild(sp);
        }
        td.appendChild(f);
      }
      const votes = s.votes ? Object.entries(s.votes).map(([el, n]) => `${ELEMENTS[el]}${n}`).join(" ") : "—";
      tr.append(cell(s.created_at, "muted"), cell(s.room_code), cell(s.round_no ?? "", "num"), td, cell(votes, "muted"));
      tb.appendChild(tr);
    }
    const pages = Math.max(1, Math.ceil(sq.total / sq.size));
    $("sentInfo").textContent = `共 ${sq.total} 句 · 第 ${sq.page}/${pages} 页`;
    $("sPrev").disabled = sq.page <= 1; $("sNext").disabled = sq.page >= pages;
  } catch (e) { toast(e.message, true); }
}
$("sQ").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { sq.page = 1; loadSentences(); }, 300); };
$("sPrev").onclick = () => { sq.page--; loadSentences(); };
$("sNext").onclick = () => { sq.page++; loadSentences(); };

// ---------- 标签页 ----------
for (const b of document.querySelectorAll(".tabs button")) {
  b.onclick = () => {
    for (const x of document.querySelectorAll(".tabs button")) x.classList.toggle("on", x === b);
    for (const name of ["words", "templates", "sentences"]) $(`tab-${name}`).classList.toggle("hidden", b.dataset.tab !== name);
    ({ words: loadWords, templates: loadTemplates, sentences: loadSentences })[b.dataset.tab]();
  };
}

// ---------- 小工具 ----------
let toastTimer = null;
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.className = `toast ${err ? "err" : "ok"}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
}

if (token) login();
</script>
</body>
</html>
